# Maskit-RS Docker Compose 示例
#
# 用法：
#   docker compose up -d
#   然后打开 http://127.0.0.1:18701/console
#
# 首次启动令牌见容器日志（docker compose logs maskit | grep token）
# 或在 data/config.json 的 panel_token 字段查看/修改。

services:
  maskit:
    # 本地构建（默认）
    build:
      context: .
      dockerfile: Dockerfile
    image: maskit-rs:local
    container_name: maskit-rs
    restart: unless-stopped

    # 以镜像内的 nonroot(65532) 运行。
    #
    # 本文件默认用**命名卷** `maskit-data`，它初始化时会继承镜像里 /data 的
    # 属主（nonroot:nonroot），所以 65532 开箱即用、无需改宿主机目录权限。
    #
    # ⚠️ 若改成绑定挂载（如 `- ./data:/data`）：宿主机目录由 root 创建，
    #   65532 写不进去，会报「数据目录初始化失败: Permission denied」。
    #   此时把下面这行换成以宿主当前用户身份运行：
    #       user: "${UID:-65532}:${GID:-65532}"
    #   或者先 `sudo chown -R 65532:65532 ./data`。
    #
    # （曾把 `user:` 写了两遍：YAML 映射不允许重复键，新版 compose 直接报
    #   `mapping key "user" already defined` → `docker compose up -d` 根本起不来。）
    user: "65532:65532"

    ports:
      # 单端口：Web 控制台(/console) + 管理 API + LLM 反代 共用
      - "127.0.0.1:18701:18701"

    volumes:
      # 配置与事件库持久化（SQLite），容器重建不丢历史。
      # 用**命名卷**而非 ./data 绑定挂载：镜像内 /data 已属 nonroot(65532)，
      # 命名卷初始化会继承该属主，因此开箱即用、无需改宿主机目录权限。
      # （绑定挂载时宿主目录由 root 创建，容器内 nonroot 写不进去，
      #   需 `sudo chown -R 65532:65532 ./data` 或加 `user: "$(id -u):$(id -g)"`）
      - maskit-data:/data

    environment:
      MASKIT_RS_DATA_DIR: /data
      # 必须绑 0.0.0.0：容器内绑 127.0.0.1 时 `-p` 端口映射接不到
      # （curl 报 (52) Empty reply from server）。对外仍由上面的
      # `127.0.0.1:18701:18701` 限定为仅本机可访问。
      MASKIT_RS_BIND: "0.0.0.0"
      RUST_LOG: info
      # TZ: Asia/Shanghai

    # distroless 镜像没有 shell，无法 exec 排障；需要时用 docker logs

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 资源上限（按需调整；脱敏是 CPU 密集型，给足 CPU 配额更稳）
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

# ---------------------------------------------------------------------------
# 改用 GHCR 镜像（发布版）时，把上面的 build/image 换成：
#
#   image: ghcr.io/<你的账号或组织>/maskit-rs:v0.1.0
#
# 例：
#   services:
#     maskit:
#       image: ghcr.io/owner/maskit-rs:latest
#       ports: ["127.0.0.1:18701:18701"]
#       volumes: ["./data:/data"]
#       environment:
#         MASKIT_RS_DATA_DIR: /data
# ---------------------------------------------------------------------------

volumes:
  maskit-data:
    name: maskit-data

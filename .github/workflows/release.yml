name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则自动生成，如 v0.1.0-dev.42.20260924-1530）'
        required: false
      draft:
        description: '创建为草稿 Release'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-C strip=symbols'

jobs:
  # ---------------------------------------------------------------------
  # 0. 版本号：tag 用 tag 名；手动触发则自动生成（不落「latest」这种会漂移的名字）
  # ---------------------------------------------------------------------
  version:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
      tag: ${{ steps.gen.outputs.tag }}
      prerelease: ${{ steps.gen.outputs.prerelease }}
    steps:
      - name: 生成版本号
        id: gen
        env:
          INPUT_VERSION: ${{ inputs.version }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            # 推 tag 发布：版本即 tag（tag 本身就是 vX.Y.Z）
            version="${REF_NAME}"
            prerelease="false"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            case "$version" in
              v*) ;;
              *) version="v$version" ;;
            esac
            prerelease="true"
          else
            # 手动触发且未指定：自动生成带 run 号 + 时间戳的版本
            # （保证每次发布都有唯一版本，不会都落在 latest 上）
            stamp="$(date -u +%Y%m%d-%H%M)"
            version="v0.1.0-dev.${RUN_NUMBER}.${stamp}"
            prerelease="true"
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "发布版本：${version}"

  # ---------------------------------------------------------------------
  # 1. 质量门禁：fmt + clippy + 测试（含性能测试）
  # ---------------------------------------------------------------------
  verify:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-verify-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-verify-

      - name: 格式化检查
        run: cargo fmt --check

      - name: Clippy（零告警门禁）
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元 + 集成测试
        run: cargo test

      - name: 性能基准（release + 串行，计时才有意义）
        run: cargo test --release --test perf_tests -- --test-threads=1

  # ---------------------------------------------------------------------
  # 2. 多平台构建 + 发布 Release
  # ---------------------------------------------------------------------
  release:
    name: 构建 ${{ matrix.name }}
    needs: [verify, version]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # 创建 Release / 上传资产
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: 安装交叉编译工具链（Linux aarch64）
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: 构建二进制
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包资产（tar.gz）
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # 暂存目录：归档内带一层同名目录，解压即得干净目录。
          # ⚠️ 不要写 `tar -C dist -czf dist/x.tar.gz dist/*`：glob 在 -C 生效前
          #    就被 shell 展开，路径会指向 dist/dist（实测踩过）。
          STAGE="maskit-rs-${TARGET}"
          rm -rf "$STAGE" dist
          mkdir -p "$STAGE" dist
          cp "target/${TARGET}/release/maskit-rs" "${STAGE}/maskit-rs"
          cp config.example.json README.md "$STAGE/"
          tar -czf "dist/${STAGE}-${VERSION}.tar.gz" "$STAGE"
          rm -rf "$STAGE"
          ls -lh dist/

      - name: 打包资产（zip）
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "maskit-rs-$env:TARGET"
          Remove-Item -Recurse -Force dist, $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage, dist | Out-Null
          Copy-Item "target/$env:TARGET/release/maskit-rs.exe" "$stage/maskit-rs.exe"
          Copy-Item config.example.json, README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage-$env:VERSION.zip"
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      - name: 上传 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Maskit-RS ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          draft: ${{ inputs.draft || false }}
          files: dist/*
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------
  # 3. 容器镜像（GHCR，多架构 linux/amd64 + linux/arm64）
  # ---------------------------------------------------------------------
  docker:
    name: 构建并推送 Docker 镜像
    needs: [verify, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/maskit-rs
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short
          labels: ${{ steps.meta.outputs.labels }}

      - name: 构建并推送（amd64 + arm64）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

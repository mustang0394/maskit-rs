name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则自动生成 v0.1.<构建号>）'
        required: false
      prerelease:
        description: '标记为【预发布】。默认关闭 = 正式发布'
        type: boolean
        default: false
      draft:
        description: '先创建为草稿（不发布通知）'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: '-C strip=symbols'

jobs:
  # ---------------------------------------------------------------------
  # 0. 版本号：tag 用 tag 名；手动触发则自动生成（不落「latest」这种会漂移的名字）
  # ---------------------------------------------------------------------
  version:
    name: 解析版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen.outputs.version }}
      tag: ${{ steps.gen.outputs.tag }}
      prerelease: ${{ steps.gen.outputs.prerelease }}
    steps:
      - name: 生成版本号
        id: gen
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          # 默认正式发布；只有显式勾选 prerelease 才是预发布。
          # （此前手动触发一律标 prerelease，导致想要的正式版变成 Pre-release）
          if [ "$IS_TAG" = "true" ]; then
            # 推 tag 发布：版本即 tag（tag 本身就是 vX.Y.Z）
            version="${REF_NAME}"
            prerelease="false"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
            case "$version" in
              v*) ;;
              *) version="v$version" ;;
            esac
            prerelease="$INPUT_PRERELEASE"
          else
            # 未指定版本：自动生成干净递增号 v0.1.<构建号>，
            # 每次发布唯一（不会都落在 latest），且默认为正式版。
            version="v0.1.${RUN_NUMBER}"
            prerelease="$INPUT_PRERELEASE"
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "prerelease=${prerelease}"
          } >> "$GITHUB_OUTPUT"
          echo "发布版本：${version}（prerelease=${prerelease}）"

  # ---------------------------------------------------------------------
  # 1. 质量门禁：fmt + clippy + 测试（含性能测试）
  # ---------------------------------------------------------------------
  verify:
    name: 质量门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-verify-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-verify-

      - name: 格式化检查
        run: cargo fmt --check

      - name: Clippy（零告警门禁）
        run: cargo clippy --all-targets -- -D warnings

      - name: 单元 + 集成测试
        run: cargo test

      - name: 性能基准（release + 串行，计时才有意义）
        run: cargo test --release --test perf_tests -- --test-threads=1

  # ---------------------------------------------------------------------
  # 2. 多平台构建 + 发布 Release
  # ---------------------------------------------------------------------
  release:
    name: 构建 ${{ matrix.name }}
    needs: [verify, version]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # 创建 Release / 上传资产
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux 固定用 22.04（glibc 2.35）构建：产物要进 distroless/cc-debian12
          # （glibc 2.36）。若在 ubuntu-latest(24.04/glibc 2.39) 上构建，镜像里会报
          # GLIBC_2.xx not found。Windows 无此问题，保持 latest。
          - name: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: 安装交叉编译工具链（Linux aarch64）
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: 构建二进制
        run: cargo build --release --target ${{ matrix.target }}

      - name: 打包资产（tar.gz）
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # 暂存目录：归档内带一层同名目录，解压即得干净目录。
          # ⚠️ 不要写 `tar -C dist -czf dist/x.tar.gz dist/*`：glob 在 -C 生效前
          #    就被 shell 展开，路径会指向 dist/dist（实测踩过）。
          STAGE="maskit-rs-${TARGET}"
          rm -rf "$STAGE" dist
          mkdir -p "$STAGE" dist
          cp "target/${TARGET}/release/maskit-rs" "${STAGE}/maskit-rs"
          cp config.example.json README.md "$STAGE/"
          tar -czf "dist/${STAGE}-${VERSION}.tar.gz" "$STAGE"
          rm -rf "$STAGE"
          ls -lh dist/

      - name: 打包资产（zip）
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "maskit-rs-$env:TARGET"
          Remove-Item -Recurse -Force dist, $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage, dist | Out-Null
          Copy-Item "target/$env:TARGET/release/maskit-rs.exe" "$stage/maskit-rs.exe"
          Copy-Item config.example.json, README.md $stage
          Compress-Archive -Path $stage -DestinationPath "dist/$stage-$env:VERSION.zip"
          Remove-Item -Recurse -Force $stage
          Get-ChildItem dist

      # 把 Linux 二进制交给 docker job：镜像直接用这个产物组装，
      # 不再在容器里重编一遍（arm64 尤其能省掉 QEMU 模拟编译）。
      - name: 上传 Linux 二进制（供 Docker 组装）
        if: ${{ !contains(matrix.target, 'windows') }}
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/maskit-rs
          if-no-files-found: error
          retention-days: 1

      - name: 上传 Release 资产
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Maskit-RS ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          draft: ${{ inputs.draft || false }}
          files: dist/*
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------
  # 3. 容器镜像（GHCR，多架构 linux/amd64 + linux/arm64）
  # ---------------------------------------------------------------------
  docker:
    name: 组装并推送 Docker 镜像
    # 依赖 release：直接复用那里已构建好的 Linux 二进制，
    # 避免在容器里把同样的依赖树重编一遍。
    needs: [verify, version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # 本 Dockerfile 只有 COPY/ENV/USER 等指令，不执行任何二进制，
      # 因此组装多架构镜像无需 QEMU 模拟。
      - uses: docker/setup-buildx-action@v3

      - name: 下载 Linux 二进制
        uses: actions/download-artifact@v4
        with:
          pattern: bin-linux-*
          merge-multiple: false

      - name: 摆放二进制到 bin/<arch>/
        run: |
          set -euo pipefail
          mkdir -p bin/amd64 bin/arm64
          # artifact 下载后是 `bin-linux-<target>/maskit-rs`
          for d in bin-linux-*; do
            [ -d "$d" ] || continue
            case "$d" in
              *aarch64*) cp "$d/maskit-rs" bin/arm64/maskit-rs ;;
              *x86_64*)  cp "$d/maskit-rs" bin/amd64/maskit-rs ;;
            esac
          done
          rm -rf bin-linux-*
          # artifact 不保留可执行位，必须显式补上，否则镜像里 exec 报 permission denied
          chmod +x bin/amd64/maskit-rs bin/arm64/maskit-rs
          ls -lR bin

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          # github.repository 已经是 <owner>/<repo>，直接用作镜像名，
          # 不要再拼一次仓库名（否则会得到 .../maskit-rs/maskit-rs）
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short
          labels: ${{ steps.meta.outputs.labels }}

      - name: 组装并推送（amd64 + arm64，复用已构建二进制）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
